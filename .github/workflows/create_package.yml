name: Create package

on:
  pull_request:
    branches: [typed]
    types: [closed]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v3
      - name: Setup .NET
        uses: actions/setup-dotnet@v2
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore
      - name: Run tests
        run: dotnet test -- --ignore-exit-code 8
      - name: Create packages
        run: |
          dotnet pack -c Release -o pkg
      - name: NuGet login (fetch temp API key via OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push package to Nuget registry
        run: |
          cd ./pkg
          dotnet nuget push *.nupkg -s https://api.nuget.org/v3/index.json --skip-duplicate --no-symbols --api-key ${{steps.login.outputs.NUGET_API_KEY}}
